name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:MyPassword%23135@postgres:5432/project01_test?schema=public"
      JWT_SECRET: "test-secret"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "test-refresh-secret"
      NODE_ENV: "test"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "MyPassword#135"
          POSTGRES_DB: project01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d project01_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config ./prisma.config.ts

      - name: Run database migrations
        run: npx prisma migrate deploy --config ./prisma.config.ts

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test